# Nginx Configuration for Atlantic Leather Frontend
# Place this file at: /etc/nginx/sites-available/atlanticleatherethiopia.com

server {
    listen 80;
    listen [::]:80;
    server_name atlanticleatherethiopia.com www.atlanticleatherethiopia.com;

    # Redirect HTTP to HTTPS (will be enabled after SSL setup)
    # Uncomment after SSL is configured:
    # return 301 https://$server_name$request_uri;

    # For initial setup without SSL, proxy to Next.js:
    location / {
        proxy_pass http://localhost:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }
}

